[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "akshare-sidecar"
version = "0.1.0"
description = "Minimal AKShare sidecar for the personal cockpit (T2 supplement only)"
requires-python = ">=3.11"
dependencies = [
  "akshare==1.20.2",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
akshare-sidecar = "akshare_sidecar.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
