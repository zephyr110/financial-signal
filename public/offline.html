<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#edf1ef" />
    <title>离线 · 收盘手记</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #edf1ef;
        --surface: #fafbfa;
        --ink: #17211f;
        --muted: #46534f;
        --line: #d0d9d5;
        --accent: #1f5c55;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1514;
          --surface: #16201e;
          --ink: #e8edeb;
          --muted: #aab6b2;
          --line: #2a3734;
          --accent: #79b8ac;
        }
      }
      * { box-sizing: border-box; }
      body {
        display: grid;
        min-height: 100dvh;
        margin: 0;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        line-height: 1.7;
      }
      main {
        width: 100%;
        max-width: 420px;
        padding: 28px;
        border: 1px solid var(--line);
        border-top: 3px solid var(--accent);
        border-radius: 8px;
        background: var(--surface);
      }
      .mark {
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        border: 1px solid var(--accent);
        border-radius: 4px;
        color: var(--accent);
        font-family: "Songti SC", "STSong", serif;
        font-size: 19px;
        font-weight: 700;
      }
      h1 {
        margin: 18px 0 6px;
        font-family: "Songti SC", "STSong", "Noto Serif CJK SC", serif;
        font-size: 27px;
        line-height: 1.3;
      }
      p { margin: 0; color: var(--muted); font-size: 13px; }
      .hint { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
      a {
        display: inline-flex;
        margin-top: 18px;
        padding: 8px 12px;
        border: 1px solid var(--accent);
        border-radius: 5px;
        color: var(--accent);
        font-size: 12px;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">收</div>
      <h1>现在没有网络</h1>
      <p>收盘手记需要连接本地服务才能生成新简报、读取行情和派发任务。出于隐私考虑，页面不会离线缓存；恢复连接后刷新即可查看最新数据。</p>
      <p class="hint">恢复网络后刷新页面。若仍无法连接，请检查运行服务的设备与当前网络。</p>
      <a href="/today">重试今日收盘</a>
    </main>
  </body>
</html>
