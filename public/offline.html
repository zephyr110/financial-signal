<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafafa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />
    <title>离线 · 财经信号</title>
    <script>
      // 与 _document 的主题预置保持一致：离线页也跟随用户选择的浅色/深色。
      (function () {
        try {
          var s = localStorage.getItem('theme');
          var t = s === 'dark' || s === 'light' ? s : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.classList.add(t);
        } catch (e) {}
      })();
    </script>
    <style>
      :root {
        color-scheme: light;
        --bg: #fafafa;
        --surface: #ffffff;
        --ink: #1a1a1a;
        --muted: #6b7280;
        --line: #e5e5e5;
        --accent: #2563eb;
        --accent-foreground: #ffffff;
        --tint: #f3f4f6;
        --radius: 0.75rem;
        --shadow: 0 12px 32px -16px rgb(0 0 0 / 0.25);
      }
      html.dark {
        color-scheme: dark;
        --bg: #0a0a0a;
        --surface: #141414;
        --ink: #e5e5e5;
        --muted: #9ca3af;
        --line: #262626;
        --accent: #3b82f6;
        --accent-foreground: #ffffff;
        --tint: #1f1f1f;
      }
      * {
        box-sizing: border-box;
      }
      body {
        display: grid;
        min-height: 100dvh;
        margin: 0;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        font-size: 14px;
        line-height: 1.7;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      main {
        width: 100%;
        max-width: 440px;
        padding: 32px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
        box-shadow: var(--shadow);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .brand img {
        width: 28px;
        height: 28px;
        flex: none;
        filter: invert(1);
      }
      html.dark .brand img {
        filter: none;
      }
      .brand-copy {
        display: flex;
        min-width: 0;
        flex-direction: column;
      }
      .brand-name {
        font-size: 15px;
        font-weight: 600;
        line-height: 20px;
        letter-spacing: -0.01em;
      }
      .brand-latin {
        color: var(--muted);
        font-size: 10px;
        font-weight: 500;
        line-height: 12px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      .eyebrow {
        margin: 32px 0 0;
        color: var(--muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      h1 {
        margin: 8px 0 0;
        font-size: 24px;
        font-weight: 600;
        line-height: 1.3;
        letter-spacing: -0.01em;
      }
      p {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.7;
      }
      .hint {
        margin-top: 18px;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: calc(var(--radius) * 0.67);
        background: var(--tint);
        font-size: 12.5px;
        line-height: 1.6;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 26px;
      }
      .actions a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 36px;
        padding: 0 14px;
        border: 1px solid transparent;
        border-radius: calc(var(--radius) * 0.67);
        font-size: 13px;
        font-weight: 500;
        text-decoration: none;
        transition: background-color 0.15s ease, color 0.15s ease;
      }
      .actions .primary {
        background: var(--accent);
        color: var(--accent-foreground);
      }
      .actions .primary:hover {
        background: color-mix(in srgb, var(--accent) 82%, var(--ink));
      }
      .actions .secondary {
        border-color: var(--line);
        background: var(--surface);
        color: var(--ink);
      }
      .actions .secondary:hover {
        background: var(--tint);
      }
      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      @media (max-width: 420px) {
        body {
          padding: 16px;
        }
        main {
          padding: 24px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <img src="/logo.png" alt="" aria-hidden="true" />
        <span class="brand-copy">
          <span class="brand-name">财经信号</span>
          <span class="brand-latin">Financial Signal</span>
        </span>
      </div>
      <p class="eyebrow">离线 · Offline</p>
      <h1>现在没有网络</h1>
      <p>财经信号需要连接本地服务才能读取行情、生成简报和派发任务。页面不会缓存任何私有数据，恢复连接后刷新即可。</p>
      <p class="hint">恢复网络后刷新页面。若仍无法连接，请检查运行服务的设备与当前网络。</p>
      <div class="actions">
        <a class="primary" href="/today">重试今日收盘</a>
        <a class="secondary" href="/tasks">查看任务中心</a>
      </div>
    </main>
  </body>
</html>
